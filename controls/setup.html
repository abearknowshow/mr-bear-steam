<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="setup-token" content="__SETUP_TOKEN__"><title>Sign in · Bear Steam</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#111820;color:#f5f6fa;font:17px/1.55 system-ui,sans-serif;padding:40px 24px}main{max-width:570px;margin:5vh auto}h1{font-size:34px;letter-spacing:-1px;line-height:1.15}p{color:#b2bdcd}form{padding:26px;background:#222c38;border:1px solid #344150;border-radius:22px;display:grid;gap:12px}label{display:grid;gap:6px}input,button{font:inherit;min-height:52px;border-radius:12px;border:1px solid #67788e;padding:10px 14px}input{background:#111820;color:#fff}button{background:#dce6ff;color:#172d4d;font-weight:600;cursor:pointer;margin-top:8px}button:disabled{opacity:.6;cursor:default}small{color:#b2bdcd}#status{min-height:28px;color:#dce6ff}a{color:#dce6ff}
</style></head><body><main><small>A BEAR KNOWS STEAM</small><h1>Sign in to Mr. Steam.</h1><p>Use your existing account and the code shown on the panel. You can use your Mac’s saved password.</p><form id="signin" autocomplete="on"><label>Code shown on the panel<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></label><label>Mr. Steam email<input id="email" name="username" type="email" autocomplete="username" required maxlength="254"></label><label>Password<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="2048"></label><button id="submit">Sign in</button><small>Your login goes securely to the panel once. It stays signed in; this page does not save your password.</small></form><p id="status" role="status"></p><p><a href="http://{{MAC_HOST}}:8775/">Installation and morning test</a></p></main><script src="/setup.js"></script></body></html>
